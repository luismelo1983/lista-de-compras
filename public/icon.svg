<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="120" fill="#ffffff"/>
  
  <g transform="translate(110, 130)">
    <!-- Item 1: Laranja/Amarelo -->
    <path d="M20 55l25 25l50 -50" stroke="#f48120" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softShadow)"/>
    <rect x="135" y="55" width="180" height="28" rx="14" fill="#fcc233" filter="url(#softShadow)"/>
    
    <!-- Item 2: Verde -->
    <path d="M20 155l25 25l50 -50" stroke="#76e082" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softShadow)"/>
    <rect x="135" y="155" width="180" height="28" rx="14" fill="#76e082" filter="url(#softShadow)"/>
    
    <!-- Item 3: Azul -->
    <path d="M20 255l25 25l50 -50" stroke="#55a6f1" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softShadow)"/>
    <rect x="135" y="255" width="180" height="28" rx="14" fill="#55a6f1" filter="url(#softShadow)"/>
  </g>
</svg>